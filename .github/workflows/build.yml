name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Générer la page et synchroniser Android
        run: |
          python3 tools/build_app.py src/page.html www/index.html
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk novembre-a-deux.apk

      - uses: actions/upload-artifact@v4
        with:
          name: novembre-a-deux
          path: novembre-a-deux.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Novembre à deux — build ${{ github.run_number }}
          files: novembre-a-deux.apk
          make_latest: true
